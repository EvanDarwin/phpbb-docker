upstream php {
    server unix:/run/php-fpm/php-fpm.sock;
}

# let phpBB declare its own Referrer-Policy, falling back to ours when empty
map $upstream_http_referrer_policy $referrer_policy {
    ''      'strict-origin-when-cross-origin';
    default '';
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /var/www/phpbb;
    index index.php index.html index.htm;

    # Logging configuration
    error_log /run/nginx/error.log warn;
    access_log /run/nginx/access.log;

    # Disable server signature
    server_tokens off;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy $referrer_policy always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Content-Security-Policy, written at boot from CONTENT_SECURITY_POLICY or the default
    include /run/nginx/content-security-policy.conf;

    # X-Forwarded-For is trusted only from TRUSTED_PROXIES, written at boot
    include /run/nginx/trusted-proxies.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    fastcgi_param REMOTE_ADDR $remote_addr;

    # Maximum upload file size
    client_max_body_size 24m;
    
    # Internal directories, as whole path segments at any depth (extensions ship their
    # own vendor/ and tests/), except phpbb/: ext/phpbb/ is the bundled extension
    location ~ /(bin|cache|config|docs|files|includes|store|tests|vendor)(/|$)|^/phpbb(/|$)|^/images/avatars/upload(/|$)|/(config|common)\.php$|/composer\.(json|lock)$|/phpunit\.xml$ {
        deny all;
        return 403;
    }

    # Protect sensitive files
    location ~ \.(yaml|yml|ini|log|sh|sql|inc|bak)$ {
        deny all;
        return 403;
    }

    # Installer, dotfiles and database files; before the PHP location, which would
    # otherwise run /install/app.php
    location ~* ^/install/|/\.|\.(sqlite3?|db|sql)$ {
        deny all;
        return 403;
    }

    # Static files caching
    location ~* \.(gif|jpe?g|png|webp|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        add_header_inherit merge;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Primary rewrite rule for phpBB
    location / {
        try_files $uri $uri/ @rewriteapp;
    }

    # PHP files handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Security settings
        fastcgi_param PHP_VALUE "open_basedir=/var/www/phpbb:/opt/phpbb:/var/cache/phpbb:/tmp;";
        fastcgi_request_buffering on;
        fastcgi_read_timeout 60s;
    }

    # phpBB rewrite rules
    location @rewriteapp {
        rewrite ^(.*)$ /app.php/$1 last;
    }

    # Handle app.php properly
    location ~ ^/app\.php(/|$) {
        fastcgi_pass php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param PHP_VALUE "open_basedir=/var/www/phpbb:/opt/phpbb:/var/cache/phpbb:/tmp;";
    }
}

# PHP-FPM's ping for the container health check, on a socket so it takes no port
server {
    listen unix:/run/nginx/health.sock;

    location = /fpm-ping {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        fastcgi_pass php;
    }
}
