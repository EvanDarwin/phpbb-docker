upstream php {
    server unix:/run/php-fpm/php-fpm.sock;
}

# let phpBB declare its own Referrer-Policy, falling back to ours when empty
map $upstream_http_referrer_policy $referrer_policy {
    ''      'strict-origin-when-cross-origin';
    default '';
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /var/www/phpbb;
    index index.php index.html index.htm;

    # Logging configuration
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    # Disable server signature
    server_tokens off;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy $referrer_policy always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # IP forwarding configuration
    set_real_ip_from 127.0.0.0/8;      # Loopback
    set_real_ip_from 10.0.0.0/8;       # Private Class A
    set_real_ip_from 172.16.0.0/12;    # Private Class B
    set_real_ip_from 192.168.0.0/16;   # Private Class C
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    fastcgi_param REMOTE_ADDR $remote_addr;

    # Maximum upload file size
    client_max_body_size 24m;
    
    # Security - deny access to sensitive directories and files, including phpBB's
    # own classes in phpbb/ (as phpBB's docs/nginx.sample.conf does; ext/phpbb/ is
    # its bundled extension and stays reachable)
    location ~ /(config\.php|common\.php|cache|files|images/avatars/upload|includes|(?<!ext/)phpbb(?!\w+)|store|vendor|bin|tests|docs|install\/config\.php|phpunit\.xml|\.git|\.gitignore|\.gitattributes|composer\.(json|lock)) {
        deny all;
        return 403;
    }

    # Protect sensitive files
    location ~ \.(yaml|yml|ini|log|sh|sql|inc|bak)$ {
        deny all;
        return 403;
    }

    # Static files caching
    location ~* \.(gif|jpe?g|png|webp|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        add_header_inherit merge;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Primary rewrite rule for phpBB
    location / {
        try_files $uri $uri/ @rewriteapp;
    }

    # PHP files handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Security settings
        fastcgi_param PHP_VALUE "open_basedir=/var/www/phpbb:/opt/phpbb:/var/cache/phpbb:/tmp;";
        fastcgi_request_buffering on;
        fastcgi_read_timeout 60s;
    }

    # phpBB rewrite rules
    location @rewriteapp {
        rewrite ^(.*)$ /app.php/$1 last;
    }

    # Handle app.php properly
    location ~ ^/app\.php(/|$) {
        fastcgi_pass php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param PHP_VALUE "open_basedir=/var/www/phpbb:/opt/phpbb:/var/cache/phpbb:/tmp;";
    }

    # The installer stays in the read-only image and only runs from the CLI
    # inside the container, so it is never served
    location ^~ /install/ {
        deny all;
        return 403;
    }

    # Deny access to version control and hidden files
    location ~ /\.(svn|git|hg) {
        deny all;
        return 403;
    }

    location ~ /\. {
        deny all;
        return 403;
    }
    
    # Block access to database files
    location ~* \.(sqlite|sqlite3|db|sql)$ {
        deny all;
        return 403;
    }
}

# PHP-FPM's ping for the container health check, on a socket so it takes no port
server {
    listen unix:/run/nginx/health.sock;

    location = /fpm-ping {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        fastcgi_pass php;
    }
}
