name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run daily to ensure latest build is available
    - cron: '0 0 * * *'

# Add concurrency to cancel duplicate runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: evandarwin/phpbb
  # Every stable phpBB release from this one on is built and published
  MIN_PHPBB_VERSION: 3.3.15

jobs:
  # The stable phpBB releases to build, from MIN_PHPBB_VERSION on: only release-X.Y.Z tags
  # count, so alphas, betas and release candidates are never built
  versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}

    # Only run scheduled jobs on the main repository
    if: >-
      github.event_name != 'schedule' ||
      (github.event_name == 'schedule' && github.repository == 'EvanDarwin/phpbb-docker')

    steps:
      - name: List the phpBB versions to build
        id: versions
        run: |
          # Every release tag, without the API's paging or rate limit
          if ! TAGS=$(git ls-remote --tags --refs https://github.com/phpbb/phpbb.git 'release-*'); then
            echo "::error::Failed to fetch phpBB tags"
            exit 1
          fi
          # Each version with its PHP (8.4 for phpBB 3, 8.5 from phpBB 4) and whether it's
          # the newest of its minor, of its major and overall, which decides its moving tags
          echo "$TAGS" | python3 -c '
          import json, os, re, sys
          minimum = tuple(int(part) for part in os.environ["MIN_PHPBB_VERSION"].split("."))
          versions = sorted({tuple(int(part) for part in match.groups()) for match in
                             (re.search(r"refs/tags/release-(\d+)\.(\d+)\.(\d+)$", line) for line in sys.stdin)
                             if match})
          versions = [version for version in versions if version >= minimum]
          if not versions:
              print("::error::Could not find a stable phpBB release in phpBB tags")
              sys.exit(1)
          newest_in_minor = {version[:2]: version for version in versions}
          newest_in_major = {version[:1]: version for version in versions}
          include = [{
              "version": "%d.%d.%d" % version,
              "minor": "%d.%d" % version[:2],
              "major": "%d" % version[0],
              "php": "8.4" if version[0] < 4 else "8.5",
              "newest_in_minor": newest_in_minor[version[:2]] == version,
              "newest_in_major": newest_in_major[version[:1]] == version,
              "newest": versions[-1] == version,
          } for version in versions]
          for entry in include:
              print("[docker-phpbb] phpBB %(version)s on PHP %(php)s" % entry)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": include}) + "\n")
          '

  build:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for SLSA provenance
      security-events: write # For the Docker Scout results
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker: every version gets its own tag, and the
      # moving tags go to the newest version they cover
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=${{ matrix.minor }},enable=${{ matrix.newest_in_minor }}
            type=raw,value=${{ matrix.major }},enable=${{ matrix.newest_in_major }}
            type=ref,event=branch,enable=${{ matrix.newest }}
            type=ref,event=pr
            type=raw,value=latest,enable=${{ matrix.newest && github.ref_name == github.event.repository.default_branch }}

      # Build and push Docker image with Buildx
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHPBB_VERSION=${{ matrix.version }}
            PHP_VERSION=${{ matrix.php }}
          provenance: true
          sbom: true
          platforms: linux/amd64,linux/arm64

      # Fixable critical and high vulnerabilities in the image just pushed, reported to the
      # Security tab without failing the run
      - name: Scan the image with Docker Scout
        if: github.event_name != 'pull_request'
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: cves
          image: registry://${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
          only-severities: critical,high
          only-fixed: true
          sarif-file: scout.sarif
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Upload the results to the Security tab
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scout.sarif
          category: phpbb-${{ matrix.version }}
