name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main
  workflow_dispatch:
  schedule:
    # Run daily to ensure latest build is available
    - cron: '0 0 * * *'

# Add concurrency to cancel duplicate runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: evandarwin/phpbb

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for SLSA provenance
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}

    # Only run scheduled jobs on the main repository
    if: >-
      github.event_name != 'schedule' || 
      (github.event_name == 'schedule' && github.repository == 'EvanDarwin/phpbb-docker')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # Get the newest stable phpBB release for auto tagging: only release-X.Y.Z tags count,
      # so alphas, betas and release candidates are never built
      - name: Get latest phpBB version
        id: phpbb-version
        run: |
          # Every release tag, without the API's paging or rate limit
          if ! TAGS=$(git ls-remote --tags --refs https://github.com/phpbb/phpbb.git 'release-*'); then
            echo "::error::Failed to fetch phpBB tags"
            exit 1
          else
            VERSION=$(echo "$TAGS" | \
              grep -oE 'release-[0-9]+\.[0-9]+\.[0-9]+$' | \
              sed 's/^release-//' | \
              sort -V | \
              tail -1 || true)

            # If we successfully found a version, parse it
            if [[ -n "$VERSION" ]]; then
              echo "version=${VERSION}" >> $GITHUB_OUTPUT
              
              # Extract major and minor versions for tagging
              VERSION_MAJOR=$(echo $VERSION | cut -d. -f1)
              VERSION_MINOR=$(echo $VERSION | cut -d. -f2)
              
              echo "version_major=${VERSION_MAJOR}" >> $GITHUB_OUTPUT
              echo "version_minor=${VERSION_MINOR}" >> $GITHUB_OUTPUT
              echo "[docker-phpbb] Found phpBB version: ${VERSION} (${VERSION_MAJOR}.${VERSION_MINOR})"
            else
              echo "::error::Could not find a stable phpBB release in phpBB's tags"
              exit 1
            fi
          fi
      
      # Set the PHP version and prepare tag format
      - name: Set image name with PHP and phpBB versions
        id: image-name
        run: |
          PHP_VERSION=84
          PHPBB_VERSION="${{ steps.phpbb-version.outputs.version }}"
          PHPBB_VERSION_MAJOR="${{ steps.phpbb-version.outputs.version_major }}"
          PHPBB_VERSION_MINOR="${{ steps.phpbb-version.outputs.version_minor }}"
          
          # Generate version-specific image name
          VERSIONED_IMAGE="${{ env.IMAGE_NAME }}:${PHPBB_VERSION}"
          MAJOR_VERSION_TAG="${{ env.IMAGE_NAME }}:${PHPBB_VERSION_MAJOR}"
          MINOR_VERSION_TAG="${{ env.IMAGE_NAME }}:${PHPBB_VERSION_MAJOR}.${PHPBB_VERSION_MINOR}"
          
          # Add custom tags
          echo "versioned_image=${VERSIONED_IMAGE}" >> $GITHUB_OUTPUT
          echo "major_version_tag=${MAJOR_VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "minor_version_tag=${MINOR_VERSION_TAG}" >> $GITHUB_OUTPUT
          
          # For debugging
          echo "Setting image tag: ${VERSIONED_IMAGE}"
          echo "Major version tag: ${MAJOR_VERSION_TAG}"
          echo "Minor version tag: ${MINOR_VERSION_TAG}"

      # Build and push Docker image with Buildx
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.image-name.outputs.versioned_image }}
            ${{ steps.image-name.outputs.major_version_tag }}
            ${{ steps.image-name.outputs.minor_version_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHPBB_VERSION=${{ steps.phpbb-version.outputs.version }}
            PHP_VERSION=84
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          platforms: linux/amd64,linux/arm64

  # Fixable critical and high vulnerabilities in the image just pushed, reported to the
  # Security tab without failing the run
  scan:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Scan the image with Docker Scout
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: cves
          image: registry://${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          only-severities: critical,high
          only-fixed: true
          sarif-file: scout.sarif
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Upload the results to the Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scout.sarif
